name: Sort existing tracks by decade and mood
# Started by hand: sorts the tracks already in the main playlist into the
# decade / genre playlists defined in config.txt. New tracks are sorted every evening.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sort = sort the tracks; tempo-report = measure tempo and energy only; remove-genre-decade = delete the genre/decade playlists; remove-marked = remove the tracks marked Remove in the Notion history"
        default: "sort"

concurrency:
  group: radio-listening
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUSIC_EMAIL: ${{ secrets.MUSIC_EMAIL }}
      MUSIC_PASSWORD: ${{ secrets.MUSIC_PASSWORD }}
      MUSIC_API_URL: ${{ secrets.MUSIC_API_URL }}
      MUSIC_APP_ID: ${{ secrets.MUSIC_APP_ID }}
      STREAM_URL: ${{ secrets.STREAM_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/classify.yml
      - name: Restore the cached ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: Install the tools
        run: |
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$url" \
              && tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' || true
          fi
          if [ -x "$HOME/ffmpeg/ffmpeg" ]; then echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          pip install -q requests librosa==0.11.0
      - name: Sort the tracks
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            tempo-report) python radio_listen.py --tempo-report ;;
            remove-genre-decade) python radio_listen.py --remove-genre-decade ;;
            remove-marked) python radio_listen.py --remove-marked ;;
            *) python radio_listen.py --classify ;;
          esac
