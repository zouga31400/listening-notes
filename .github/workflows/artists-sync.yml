name: Artists sync
# Fills the Notion database "Radio - Artists" (biography, albums, influences, similar artists)
# for the artists of the history that are not in it yet. Every morning, or by hand.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "New artists to add in this run"
        default: "120"
      refresh_empty:
        description: "Retry the rows without biography and albums (1 = yes)"
        default: "0"
  schedule:
    - cron: "40 6 * * *"

permissions:
  contents: read

jobs:
  artists:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      MUSIC_EMAIL: ${{ secrets.MUSIC_EMAIL }}
      MUSIC_PASSWORD: ${{ secrets.MUSIC_PASSWORD }}
      MUSIC_API_URL: ${{ secrets.MUSIC_API_URL }}
      MUSIC_APP_ID: ${{ secrets.MUSIC_APP_ID }}
      ARTISTS_LIMIT: ${{ github.event.inputs.limit || '120' }}
      REFRESH_EMPTY: ${{ github.event.inputs.refresh_empty || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the tools
        run: pip install -q requests
      - name: Complete the artists database
        run: python artists_sync.py
