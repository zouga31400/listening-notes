name: Radio listening
on:
  # Started every evening by an external scheduler (GitHub schedules proved unreliable).
  workflow_dispatch:
    inputs:
      minutes:
        description: "Test length in minutes (leave empty for the normal evening run)"
        default: ""

concurrency:
  group: radio-listening
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MUSIC_EMAIL: ${{ secrets.MUSIC_EMAIL }}
      MUSIC_PASSWORD: ${{ secrets.MUSIC_PASSWORD }}
      MUSIC_API_URL: ${{ secrets.MUSIC_API_URL }}
      MUSIC_APP_ID: ${{ secrets.MUSIC_APP_ID }}
      MUSIC_WEB_URL: ${{ secrets.MUSIC_WEB_URL }}
      STREAM_URL: ${{ secrets.STREAM_URL }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      MUSIC_WEB_URL: ${{ secrets.MUSIC_WEB_URL }}
      STREAM_URL_BACKUP: ${{ secrets.STREAM_URL_BACKUP }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      SHOW_END_TOPIC: ${{ secrets.SHOW_END_TOPIC }}
      TEST_MINUTES: ${{ github.event.inputs.minutes }}
      VERBOSE_LOGS: ${{ vars.VERBOSE_LOGS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/radio.yml
      - name: Restore the cached ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: Install the tools
        run: |
          # Prebuilt static ffmpeg, kept in the cache: seconds instead of minutes of apt.
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            if curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$url"; then
              tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' || true
            fi
          fi
          if [ -x "$HOME/ffmpeg/ffmpeg" ] && "$HOME/ffmpeg/ffmpeg" -hide_banner -version >/dev/null; then
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            echo "Static ffmpeg ready"
          else
            echo "Static ffmpeg unavailable, falling back to apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          # Pinned versions: an untested upgrade cannot break an evening.
          pip install -q shazamio==0.9.0 shazamio-core==2.0.0 requests librosa==0.11.0
      - name: Listen, recognize, add
        run: python radio_listen.py
