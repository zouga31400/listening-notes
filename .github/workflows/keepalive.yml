name: Keep scheduled workflows alive
# GitHub disables scheduled workflows after 60 days without activity.
# This workflow re-enables them twice a month, without creating a commit.
on:
  schedule:
    - cron: "17 10 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  reenable:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in radio.yml keepalive.yml notion-lists.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Workflow $wf re-enabled"
          done
