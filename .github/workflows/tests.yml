name: Tests
on:
  push:
    paths: ["**.py", "tests/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Install requests
        run: pip install -q requests
      - name: Run the tests
        run: python -m unittest discover -s tests -v
