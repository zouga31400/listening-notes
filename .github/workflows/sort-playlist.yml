name: Sort a playlist by mood and period
# Started by hand: copies of a playlist (e.g. Moto) sorted by mood (tempo and energy
# measured on a 30-second preview) and period, named from sort_playlist_name in config.txt.
on:
  workflow_dispatch:
    inputs:
      playlists:
        description: "Playlists to sort (comma-separated; empty = config.txt)"
        default: ""

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MUSIC_EMAIL: ${{ secrets.MUSIC_EMAIL }}
      MUSIC_PASSWORD: ${{ secrets.MUSIC_PASSWORD }}
      MUSIC_API_URL: ${{ secrets.MUSIC_API_URL }}
      MUSIC_APP_ID: ${{ secrets.MUSIC_APP_ID }}
      PLAYLISTS: ${{ github.event.inputs.playlists }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/sort-playlist.yml
      # Same installation as classify.yml: a cached static ffmpeg (apt-get can hang).
      - name: Restore the cached ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-static-v1
      - name: Install the tools
        timeout-minutes: 10
        run: |
          if [ ! -x "$HOME/ffmpeg/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg"
            url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$url" \
              && tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg' || true
          fi
          if [ -x "$HOME/ffmpeg/ffmpeg" ]; then echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          else sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          pip install -q requests librosa==0.11.0
      - name: Sort the playlists
        run: python sort_playlist.py
